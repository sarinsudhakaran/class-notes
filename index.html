<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="notes.js"></script>
<style>
  :root {
    --bg:#f4f2ff; --panel:#ffffffcc; --card:#ffffff; --text:#1e1b3a; --muted:#6b6890; --line:#e4e0fa;
    --code:#f1effe; --shadow:0 12px 32px -14px rgba(91,63,211,.35);
    --grad:linear-gradient(135deg,#7c3aed 0%,#db2777 50%,#f97316 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0c1f; --panel:#18142ecc; --card:#1c1835; --text:#efedff; --muted:#a29fc4; --line:#2d2850; --code:#25203f; --shadow:0 12px 32px -14px rgba(0,0,0,.6); }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font:16px/1.65 "Plus Jakarta Sans", system-ui, sans-serif; color:var(--text); background:var(--bg);
    background-image:radial-gradient(circle at 10% 0%, rgba(124,58,237,.18), transparent 40%),
                     radial-gradient(circle at 90% 10%, rgba(249,115,22,.14), transparent 40%),
                     radial-gradient(circle at 50% 100%, rgba(219,39,119,.12), transparent 45%);
    background-attachment:fixed; min-height:100vh;
  }
  .app { display:grid; grid-template-columns:300px 1fr; gap:24px; max-width:1200px; margin:0 auto; padding:24px; }
  aside {
    background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:20px;
    padding:20px; box-shadow:var(--shadow); position:sticky; top:24px; max-height:calc(100vh - 48px); overflow-y:auto;
  }
  .brand { font-size:1.35rem; font-weight:800; margin:0; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .progress { color:var(--muted); font-size:.85rem; margin:6px 0 8px; }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:12px; }
  .bar div { height:100%; background:var(--grad); border-radius:99px; transition:width .4s; }
  .btn {
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:12px; border:0; cursor:pointer;
    font:600 .85rem inherit; font-family:inherit; text-decoration:none; color:#fff; background:var(--grad);
    box-shadow:0 6px 16px -6px rgba(219,39,119,.6); transition:transform .15s, box-shadow .15s;
  }
  .btn:hover { transform:translateY(-1px); box-shadow:0 10px 20px -8px rgba(219,39,119,.7); }
  .btn.ghost { background:var(--card); color:var(--text); border:1px solid var(--line); box-shadow:none; }
  .btn.full { width:100%; justify-content:center; margin-bottom:18px; }
  details { margin-bottom:10px; border-radius:14px; }
  summary {
    list-style:none; cursor:pointer; font-weight:700; padding:8px 12px; border-radius:12px; display:flex; align-items:center; gap:10px;
    background:color-mix(in srgb, var(--hue) 14%, transparent);
  }
  summary::-webkit-details-marker { display:none; }
  summary .chip { width:26px; height:26px; border-radius:8px; display:grid; place-items:center; color:#fff; font-size:.8rem; background:var(--hue); }
  summary .count { margin-left:auto; color:var(--muted); font-weight:500; font-size:.8rem; }
  .days { padding:6px 0 2px 8px; }
  .day { display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:10px; color:inherit; text-decoration:none; font-size:.92rem; transition:background .15s; }
  .day:hover { background:color-mix(in srgb, var(--hue) 12%, transparent); }
  .day.active { background:var(--hue); color:#fff; font-weight:600; }
  .day.empty:not(.active) { color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; border:2px solid currentColor; flex:none; opacity:.6; }
  .day:not(.empty) .dot { background:var(--hue); border-color:var(--hue); opacity:1; }
  .day.active .dot { background:#fff; border-color:#fff; }
  .tag { margin-left:auto; font-size:.68rem; font-weight:700; padding:1px 7px; border-radius:99px; background:var(--grad); color:#fff; }
  main { min-width:0; }
  .hero { background:var(--grad); color:#fff; border-radius:24px; padding:28px 32px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .hero::after { content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.12); }
  .hero .eyebrow { font-size:.8rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.85; }
  .hero h2 { margin:4px 0 16px; font-size:clamp(1.5rem, 4vw, 2.1rem); line-height:1.2; font-weight:800; }
  .hero .actions { display:flex; gap:10px; flex-wrap:wrap; position:relative; z-index:1; }
  .hero .btn { background:rgba(255,255,255,.2); backdrop-filter:blur(6px); box-shadow:none; border:1px solid rgba(255,255,255,.35); }
  .hero .btn:hover { background:rgba(255,255,255,.3); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px 32px; margin-top:20px; box-shadow:var(--shadow); }
  .note h1 { display:none; }
  .note h2 { margin-top:1.4em; font-size:1.3rem; }
  .note h2:first-child { margin-top:0; }
  .note h2::before { content:""; display:inline-block; width:6px; height:1em; border-radius:3px; background:var(--grad); margin-right:10px; vertical-align:-2px; }
  .note blockquote { margin:1em 0; padding:12px 18px; border-radius:12px; background:color-mix(in srgb, #7c3aed 10%, transparent); border-left:4px solid #7c3aed; }
  .note pre, .note code { background:var(--code); border-radius:8px; font-size:.9em; }
  .note pre { padding:14px; overflow-x:auto; }
  .note code { padding:2px 6px; }
  .note pre code { padding:0; }
  .note img { max-width:100%; border-radius:12px; }
  .note table { border-collapse:collapse; width:100%; }
  .note th, .note td { border:1px solid var(--line); padding:6px 10px; text-align:left; }
  .placeholder { color:var(--muted); text-align:center; padding:40px 0; }
  .placeholder b { display:block; font-size:2.5rem; }
  nav.pager { display:flex; justify-content:space-between; gap:12px; margin-top:20px; }
  .menu { display:none; }
  @media (max-width:820px) {
    .app { grid-template-columns:1fr; padding:16px; gap:16px; }
    aside { position:static; max-height:none; display:none; }
    aside.open { display:block; }
    .menu { display:flex; width:100%; justify-content:center; }
    .hero, .card { padding:22px 20px; }
  }
</style>
</head>
<body>
<div class="app">
  <button class="btn menu" onclick="document.querySelector('aside').classList.toggle('open')">☰ Weeks &amp; days</button>
  <aside></aside>
  <main></main>
</div>
<script>
  const HUES = ["#7c3aed","#db2777","#f97316","#eab308","#16a34a","#0891b2","#2563eb","#9333ea","#e11d48"];
  const pad = n => String(n).padStart(2, "0");
  const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const [y, m, d] = CONFIG.start.split("-").map(Number);
  const todayKey = key(new Date());

  const weeks = [];
  for (let w = 0; w < CONFIG.weeks; w++) {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const day = new Date(y, m - 1, d + w * 7 + i);
      if (CONFIG.classDays.includes(day.getDay())) days.push(day);
    }
    weeks.push(days);
  }
  const allDays = weeks.flat();
  const keys = allDays.map(key);
  const has = k => NOTES[k] && NOTES[k].trim();
  const fmt = (dt, opts) => dt.toLocaleDateString(undefined, opts);
  const titleOf = k => (NOTES[k].match(/^#\s+(.+)$/m) || [])[1];
  document.title = CONFIG.title;

  function download(name, text) {
    const a = Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(new Blob([text], { type: "text/markdown" })), download: name
    });
    a.click(); URL.revokeObjectURL(a.href);
  }
  window.downloadNotes = k => download(`notes-${k}.md`, NOTES[k].trim() + "\n");
  window.downloadAll = () => download("all-class-notes.md",
    keys.filter(has).map(k => `<!-- ${k} -->\n${NOTES[k].trim()}`).join("\n\n---\n\n") + "\n");

  function render() {
    const latest = [...keys].reverse().find(has);
    let cur = location.hash.slice(1);
    if (!keys.includes(cur)) cur = keys.includes(todayKey) ? todayKey : (latest || keys[0]);
    const done = keys.filter(has).length;

    const aside = document.querySelector("aside");
    aside.innerHTML = `
      <h1 class="brand">${CONFIG.title}</h1>
      <div class="progress">${done} of ${keys.length} days have notes</div>
      <div class="bar"><div style="width:${(done / keys.length) * 100}%"></div></div>
      ${done ? `<button class="btn full" onclick="downloadAll()">⬇ Download all notes</button>` : ""}
      <a class="btn full ghost" href="/discovery">🎤 Discovery interview</a>
      ${weeks.map((days, w) => {
        const wk = days.map(key);
        return `<details style="--hue:${HUES[w % HUES.length]}" ${wk.includes(cur) ? "open" : ""}>
          <summary><span class="chip">${w + 1}</span>Week ${w + 1}<span class="count">${wk.filter(has).length}/${wk.length}</span></summary>
          <div class="days">${days.map(dt => {
            const k = key(dt);
            return `<a class="day ${has(k) ? "" : "empty"} ${k === cur ? "active" : ""}" href="#${k}">
              <span class="dot"></span>${fmt(dt, { weekday: "short", month: "short", day: "numeric" })}
              ${k === todayKey ? '<span class="tag">today</span>' : ""}</a>`;
          }).join("")}</div>
        </details>`;
      }).join("")}`;

    const i = keys.indexOf(cur);
    const dt = allDays[i];
    const w = weeks.findIndex(ds => ds.includes(dt));
    const prev = keys[i - 1], next = keys[i + 1];
    document.querySelector("main").innerHTML = `
      <section class="hero" style="background:linear-gradient(135deg, ${HUES[w % HUES.length]}, #db2777 60%, #f97316)">
        <div class="eyebrow">Week ${w + 1} · ${fmt(dt, { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</div>
        <h2>${has(cur) ? (titleOf(cur) || "Class notes") : "No notes yet"}</h2>
        <div class="actions">
          ${has(cur) ? `<button class="btn" onclick="downloadNotes('${cur}')">⬇ Notes (.md)</button>` : ""}
          ${TRANSCRIPTS.includes(cur) ? `<a class="btn" href="transcripts/${cur}.txt" download="transcript-${cur}.txt">⬇ Transcript (.txt)</a>` : ""}
        </div>
      </section>
      <article class="card note">${has(cur) ? marked.parse(NOTES[cur]) : '<div class="placeholder"><b>📝</b>Notes for this day haven\'t been added yet.</div>'}</article>
      <nav class="pager">
        ${prev ? `<a class="btn ghost" href="#${prev}">← ${fmt(allDays[i - 1], { month: "short", day: "numeric" })}</a>` : "<span></span>"}
        ${next ? `<a class="btn ghost" href="#${next}">${fmt(allDays[i + 1], { month: "short", day: "numeric" })} →</a>` : "<span></span>"}
      </nav>`;
    aside.classList.remove("open");
    window.scrollTo(0, 0);
  }

  addEventListener("hashchange", render);
  render();
</script>
</body>
</html>
